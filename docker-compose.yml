version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ui-generator-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ui-generator-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/auth_db
      - FRONTEND_URL=http://localhost:3000
      - RUN_MIGRATIONS=true
      # Load other options from your local .env
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - COOKIE_SECURE=false # Set false for local HTTP testing
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount codebase for dev convenience but shield python caches/venv
      - .:/app
      - /app/.venv
      - /app/__pycache__

  frontend:
    build:
      context: ../ai.nachui
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: ui-generator-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
